name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - macos-14
          - macos-26
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release binaries
        run: swift build --configuration release

      - name: Validate property lists
        run: |
          plutil -lint Info.plist
          plutil -lint launchd/com.mariedrouvin.round-music-widget.music-watcher.plist

      - name: Check source portability
        run: |
          personal_root='/'"Users/"
          if git grep -n "$personal_root"; then
            echo 'A personal absolute path was found.' >&2
            exit 1
          fi
